# Как заметки к клипам превращаются в категории приложения.
# Заметка сравнивается без учёта регистра и пробелов по краям.
# Клип без заметки попадает в категорию «без подписи».
# Заметка, которой нет в списке, становится категорией с таким же названием.
# weight — вес по умолчанию (0 — не звучит в автоответах, но доступен вручную).

calls:
  aliases:
    "обчный чик": "без подписи"
    "обычный чик": "без подписи"
    "ким": "позывной Кима"
    "чи": "позывной Чи"
    "посмотрите на меня": "посмотрите на меня"
    "забота": "забота"
    "эй": "эй"
    "злость": "злость"
  weights:
    "злость": 0
  default_weight: 1

songs:
  aliases:
    "ким": "Ким"
    "чи": "Чи"
    "ким + чи": "Ким и Чи"
  weights:
    "Ким": 1
    "Чи": 1
  default_weight: 0.5
