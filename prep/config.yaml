# Параметры нарезки. Подобраны по записи data/raw/010117-051554.MP3.
source: data/raw/010117-051554.MP3
out_dir: data/clips            # все клипы (не коммитится)
app_dir: app                   # одобренные клипы и library.json попадают сюда

analysis:
  sr: 22050                    # частота для анализа
  frame: 512                   # окно STFT (23 мс)
  hop: 256                     # шаг (11.6 мс)
  band_hz: [500, 8000]         # полоса птичьих звуков

detect:
  floor_percentile: 10         # шумовой пол = 10-й перцентиль энергии в скользящем окне
  floor_window_s: 5
  on_db: 12                    # событие начинается, если энергия выше пола на 12 дБ
  off_db: 6                    # и продолжается, пока выше пола на 6 дБ (гистерезис)
  merge_gap_ms: 15             # слоги, разделённые паузой короче этой, сливаются
  min_dur_ms: 30               # короче — выбрасываем

noise:                         # отсев щелчков, стуков и прочего шума
  max_flatness: 0.33           # спектральная плоскость (0 — тон, 1 — белый шум)
  min_harmonicity: 0.40        # 1 - минимум YIN в диапазоне f0 (0..1); шум = плоский И негармоничный
  hard_min_harmonicity: 0.30   # ниже — шум при любой плоскости
  min_snr_db: 15               # пик энергии над полом

classify:
  bout_gap_ms: 120             # слоги с паузой короче — одна серия
  song_min_s: 0.7              # серия не короче этого — кандидат в песню, если в ней
  song_min_syllables: 4        #   >= 4 слогов или есть слитный мотив
  motif_min_s: 0.35            #   длиннее этого (слоги песни идут без пауз)
  song_max_s: 10.0             # длиннее — режем на части
  call_max_s: 0.6              # крик длиннее этого (и не песня) — выбрасываем как неясный звук

# Параметры признаков (f0 350–1500 Гц, YIN-порог 0.25, центроид в полосе 500–8000 Гц)
# зашиты в prep/features.py и app/js/features.js — их нельзя менять по отдельности.

export:
  sr: 44100
  codec: aac                   # AAC в .m4a — надёжно декодируется Safari
  bitrate: 96k
  pad_ms: 25                   # запас до и после события
  fade_ms: 8                   # fade in/out (косинус)
  highpass_hz: 400
  target_rms_dbfs: -20         # нормализация громкости
  peak_ceiling_dbfs: -1

cluster:
  calls_per_group: 12          # примерно столько клипов в группе
  songs_per_group: 6
